# Chuyển tiếp về backend. include bên trong location.
proxy_pass http://kpi_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# GHI ĐÈ bằng IP kết nối thật, không nối thêm giá trị client tự gửi ($proxy_add_x_forwarded_for sẽ cho giả IP).
# Backend đặt TRUST_PROXY=1 (một lớp proxy). Nếu có CDN phía trước, đổi thành $proxy_add_x_forwarded_for và TRUST_PROXY=2.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_hide_header X-Powered-By;
# Cache-Control (no-store mặc định) và frame-ancestors do backend quyết; Nginx chỉ bổ sung HSTS, nosniff.
include /etc/nginx/snippets/security-headers.conf;
