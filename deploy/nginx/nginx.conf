# Cấu hình Nginx đứng trước giao diện (Next.js, cổng 3000) và API (NestJS, cổng 4000). Xem deploy/nginx/README.md và ADR-049.
# Mọi đường /api/auth/ (đăng nhập, phiên, MFA /api/auth/mfa/*) cùng chịu giới hạn tần suất auth_zone.
# Một tên miền, một nguồn gốc (origin): /api/ về backend, còn lại về giao diện. Nhờ cùng nguồn gốc nên cookie phiên
# SameSite=Lax gửi bình thường và không cần CORS giữa hai cổng.
# Đổi: server_name, địa chỉ upstream, đường dẫn chứng chỉ. Phần còn lại giữ nguyên trừ khi có lý do.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Ẩn phiên bản Nginx trong tiêu đề Server và trang lỗi.
  server_tokens off;

  # ---- Nhật ký truy cập ----
  # Dùng $uri (không kèm chuỗi truy vấn) để không ghi tham số tìm kiếm vào nhật ký proxy; $remote_addr là IP kết nối thật.
  log_format main '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ---- Hiệu năng, timeout ----
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  reset_timedout_connection on;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # Mặc định chặt; chỉ hai đường tải tệp lên được nới riêng bên dưới.
  client_max_body_size 1m;

  # ---- Nén ----
  # Chỉ nén văn bản. Không nén ảnh, PDF, xlsx (đã nén). Dữ liệu API không chứa mã chống CSRF trong thân phản hồi
  # (phiên nằm ở cookie httpOnly), nên nén ở đây không mở đường tấn công BREACH.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

  # ---- Giới hạn tần suất nhẹ ở lớp proxy ----
  # Lớp trong ứng dụng đã đếm đăng nhập sai theo IP (ADR-032); đây là lưới thứ hai chặn dồn dập trước khi chạm tới Node.
  # Khóa là $binary_remote_addr, tức IP kết nối thật tới Nginx.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

  # ---- Upstream (chạy trên máy chủ; đổi theo hạ tầng thật, ví dụ 127.0.0.1 hoặc địa chỉ nội bộ) ----
  upstream kpi_api {
    server host.docker.internal:4000;
    keepalive 16;
  }
  upstream kpi_web {
    server host.docker.internal:3000;
    keepalive 16;
  }

  # ---- HTTP: chuyển hết sang HTTPS ----
  server {
    listen 80 default_server;
    server_name _;

    # Cho phép xác thực HTTP-01 của nhà cấp chứng chỉ nếu dùng Let's Encrypt (bỏ khối này nếu không cần).
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS ----
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name kpi.example.vn localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Chỉ TLS 1.2 và 1.3; chỉ bộ mã trao đổi khóa ECDHE có bảo mật chuyển tiếp, mã hóa AEAD. Không RC4, 3DES, CBC, RSA key exchange.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;   # theo khuyến nghị Mozilla "intermediate" khi chỉ còn bộ mã mạnh
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;         # tránh khóa phiên dài hạn làm yếu bảo mật chuyển tiếp
    # Chứng chỉ thật từ CA: bỏ chú thích để bật OCSP stapling (chứng chỉ tự ký không dùng được).
    # ssl_stapling on; ssl_stapling_verify on; ssl_trusted_certificate /etc/nginx/certs/chain.pem; resolver 10.0.0.2 valid=300s;

    # Giới hạn số kết nối đồng thời mỗi IP (chống giữ kết nối chiếm tài nguyên).
    limit_conn conn_zone 50;

    # Chỉ các phương thức API dùng.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }

    # Tiêu đề bảo mật cho phản hồi do chính Nginx tạo (404, 405 chặn). Mỗi location có proxy tự include lại vì add_header
    # của location thay thế, không cộng dồn với cấp trên.
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Chặn các đường dẫn không cần công khai ----
    # Tài liệu API, bản mô tả OpenAPI (hiện backend không phục vụ các đường này; chặn phòng khi bật lại).
    location ~* ^/(api/)?(docs|swagger|swagger-ui|api-docs|openapi(\.json|\.yaml)?|redoc)(/|$) {
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }
    # Tệp ẩn (.git, .env...) trừ .well-known.
    location ~ /\.(?!well-known) {
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }
    # Điểm gỡ lỗi Next.js, chỉ có khi chạy chế độ phát triển.
    location ^~ /_next/webpack-hmr {
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }

    # ---- Đăng nhập, phiên: giới hạn tần suất ----
    # Chỉ đăng nhập và các bước nhập mã MFA (đoán thông tin xác thực); /api/auth/me do giao diện gọi mỗi lần đổi trang nên không giới hạn ở đây.
    location ~ ^/api/auth/(login|mfa/(verify|enroll)/.*)$ {
      limit_req zone=auth_zone burst=20 nodelay;
      include /etc/nginx/snippets/api-proxy.conf;
    }

    # ---- Tải tệp lên: nới kích thước thân ----
    # Giao việc: một tệp tối đa 20 MB (MAX_FILE_BYTES) cộng phần đệm multipart.
    location ~ ^/api/tasking/assignments/[^/]+/attachments$ {
      client_max_body_size 22m;
      client_body_timeout 120s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      include /etc/nginx/snippets/api-proxy.conf;
    }
    # Văn bản, bản tin: tối đa 10 tệp x 20 MB (MAX_FILES_PER_POST x MAX_FILE_BYTES) cộng phần đệm.
    location = /api/documents/posts {
      client_max_body_size 205m;
      client_body_timeout 300s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      include /etc/nginx/snippets/api-proxy.conf;
    }

    # ---- API còn lại ----
    # read_timeout 120 giây đủ cho xuất Excel/PDF lớn.
    location /api/ {
      proxy_read_timeout 120s;
      include /etc/nginx/snippets/api-proxy.conf;
    }

    # ---- Giao diện ----
    location / {
      proxy_pass http://kpi_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_hide_header X-Powered-By;
      include /etc/nginx/snippets/security-headers.conf;
      # Giao diện không được nhúng khung (trùng với next.config.ts; đặt thêm ở đây để còn nếu giao diện đổi).
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
    }
  }
}
