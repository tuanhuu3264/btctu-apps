# Tiêu đề bảo mật do Nginx đặt. include trong mỗi location vì add_header của location thay thế (không cộng dồn) add_header của cấp trên.
# Backend (helmet) và giao diện (next.config.ts) cũng gửi HSTS và nosniff: ẩn bản của họ để mỗi tiêu đề chỉ xuất hiện một lần.
# Referrer-Policy và Permissions-Policy do ứng dụng tự gửi (backend: no-referrer; giao diện: strict-origin-when-cross-origin), Nginx chỉ bổ sung cho phản hồi của chính nó.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Chưa đặt Content-Security-Policy đầy đủ: Next.js chèn script nội tuyến (ADR-032). Backend tự đặt frame-ancestors cho API.
